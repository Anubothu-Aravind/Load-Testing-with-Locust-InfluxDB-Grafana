# Example GitHub Actions job snippet to run headless Locust and upload CSVs
name: locust-ci
on: [workflow_dispatch]
jobs:
  loadtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - name: Install dependencies
        run: pip install locust
      - name: Run headless locust
        run: |
          locust -f locustfiles/locustfile_api_mixed.py --headless -u 100 -r 10 --run-time 5m --csv=results/ci_run
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: locust-results
          path: results/
